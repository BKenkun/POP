kind: "bundle"
schemaVersion: "v1"

runConfig:
  cpu: 1
  memoryMiB: 1024

env:
  # --- Configuración de la App (Servidor) ---
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://comprarpopperonline.com"
  - variable: APP_BASE_URL
    value: "https://comprarpopperonline.com"
  - variable: NOWPAYMENTS_PRICE_CURRENCY
    value: "eur"
  - variable: NOWPAYMENTS_FIXED_RATE
    value: "false"
  - variable: NOWPAYMENTS_FEE_PAID_BY_USER
    value: "false"
  - variable: FIREBASE_PROJECT_ID
    value: "purorush"
  - variable: FIREBASE_STORAGE_BUCKET
    value: "purorush.appspot.com"

  # --- Packlink PRO: clave de servidor (puede configurarse en Secret Manager o Admin) ---
  - variable: PACKLINK_API_KEY
    value: ""
  - variable: PACKLINK_FROM_COUNTRY
    value: "ES"
  - variable: PACKLINK_PACKAGE_WEIGHT_KG
    value: "1"
  - variable: PACKLINK_PACKAGE_LENGTH_CM
    value: "15"
  - variable: PACKLINK_PACKAGE_WIDTH_CM
    value: "8"
  - variable: PACKLINK_PACKAGE_HEIGHT_CM
    value: "6"
  # --- Configuración de Hilow ---
  - variable: HILOW_API_BASE_URL
    value: "https://hilowglobal.com"
  - variable: HILOW_PAY_ORIGIN
    value: "https://hilowglobal.com"
  - variable: HILOW_STORE_ID
    value: "comprarpopperonline.com"
  - variable: NEXT_PUBLIC_HILOW_FIREBASE_API_KEY
    value: "AIzaSyA27KSQo4tgrVNMurwrYO_B59-1njW3Qz8"
  - variable: NEXT_PUBLIC_HILOW_FIREBASE_AUTH_DOMAIN
    value: "studio-953389996-b1a64.firebaseapp.com"
  - variable: NEXT_PUBLIC_HILOW_FIREBASE_PROJECT_ID
    value: "studio-953389996-b1a64"

  # --- Configuración de Klaviyo ---
  - variable: KLAVIYO_LIST_ID
    value: "WdHvpw"

  # --- Secretos opcionales (Valores por defecto para evitar errores 404 de Secret Manager durante el despliegue) ---
  - variable: HILOW_API_KEY
    value: ""
  - variable: HILOW_WEBHOOK_SECRET
    value: ""
  - variable: STRIPE_SECRET_KEY
    value: ""
  - variable: STRIPE_WEBHOOK_SECRET
    value: ""
  - variable: NOWPAYMENTS_API_KEY

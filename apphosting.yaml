kind: "bundle"
schemaVersion: "v1"

runConfig:
  cpu: 1
  memoryMiB: 512

env:
  # --- Configuración de la App (Servidor) ---
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://comprarpopperonline.com"
  - variable: APP_BASE_URL
    value: "https://comprarpopperonline.com"
  - variable: FIREBASE_PROJECT_ID
    value: "purorush"
  - variable: FIREBASE_STORAGE_BUCKET
    value: "purorush.appspot.com"
  - variable: IMAGE_PROXY_MAX_SIZE_MB
    value: "5"
  - variable: ADMIN_EMAIL
    value: maryandpopper@gmail.com
  - variable: NEXT_PUBLIC_ADMIN_EMAIL
    value: maryandpopper@gmail.com
  - variable: SUBSCRIPTION_PRICE_CENTS
    value: "4400"

  # --- Configuración de Hilow ---
  - variable: HILOW_API_BASE_URL
    value: "https://hilowglobal.com"
  - variable: HILOW_PAY_ORIGIN
    value: "https://hilowglobal.com"
  - variable: HILOW_STORE_ID
    value: "comprarpopperonline.com"

  # --- Configuración de Klaviyo ---
  - variable: KLAVIYO_LIST_ID
    value: "WdHvpw"

  # --- Secretos (Referencia a Secret Manager) ---
  - variable: HILOW_API_KEY
    secret: HILOW_API_KEY
  - variable: HILOW_WEBHOOK_SECRET
    secret: HILOW_WEBHOOK_SECRET
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
  - variable: KLAVIYO_API_KEY
    secret: KLAVIYO_API_KEY
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON

  # --- Firebase Client (Públicas para Next.js) ---
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "purorush"
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDF062S49yLIQxxKSR-YUoHagNFAAeAjg4"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "purorush.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "purorush.appspot.com"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "870980470663"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:870980470663:web:533824f7e6c462a8d0f522"

  - variable: UPSTASH_REDIS_REST_URL
    secret: UPSTASH_REDIS_REST_URL
  - variable: UPSTASH_REDIS_REST_TOKEN
    secret: UPSTASH_REDIS_REST_TOKEN